name: CI

on:
  push:
    branches: [main]
  pull_request:

# `NEXT_PUBLIC_API_URL` is named on the steps that need it rather than on the
# workflow, because the steps that do not need it must not see it: the mocked
# suite registers its handlers against a fixed origin, and a real URL reaching
# it means requests that escape the mock. It is a repository variable rather
# than a secret — it is inlined into client JavaScript by definition, so masking
# it in logs would protect nothing and only make a failed build harder to read.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      # The budget is the only thing enforcing the Widget's module boundary
      # with the Next application, so it is checked on every commit rather than
      # noticed when somebody profiles a Tenant's page.
      - run: npm run widget:size

  drift:
    # Separate job: the API drifting is not a reason to fail the test suite,
    # and the test suite failing is not a reason to stop watching the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:drift
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
