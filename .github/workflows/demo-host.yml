name: Demo host

# The Widget's demo host is served from GitHub Pages rather than from Vercel,
# because it has to be an origin that is genuinely not this application's. A
# demo served from our own origin would pass a gate it was never tested against.
on:
  push:
    branches: [main]
    paths: ["demo-host/**", ".github/workflows/demo-host.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-host
      - id: deployment
        uses: actions/deploy-pages@v4
