name: API drift

# Drift is a property of the server changing, not of anyone pushing a commit,
# so this runs on a clock as well as in CI.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# Which API is being watched for drift is a deployment fact, so it is named in
# the workflow rather than inherited from a file in the tree.
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:drift
